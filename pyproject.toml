[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwenpaw-office-preview"
version = "1.1.0"
description = "Office document preview plugin for QwenPaw (doc/docx/ppt/pptx/xls/xlsx)"
requires-python = ">=3.10"
dependencies = [
    "mammoth>=1.8.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.2",
]

[tool.setuptools]
packages = ["converter"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP009"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]
"converter/api.py" = ["B008"]
